name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      # CI-only throwaway key (32 bytes, base64). Not a real secret.
      DATA_SOURCE_ENCRYPTION_KEY: "vEO3a+MtIF3ZtcP9d1jbs3RXKLBsSNjpR62n7760KDc="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
